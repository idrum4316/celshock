<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` paints under a notch (the HUD keeps clear of it
         with the safe-area insets below); `user-scalable=no` is what stops a
         two-finger look from pinch-zooming the page instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HOLLOWMERE — Cel-Shaded Conquest</title>

    <!-- Installable app. The manifest asks for fullscreen landscape; the two
         apple-* tags are iOS's own equivalents, which it reads instead of the
         manifest. `black-translucent` is the one that lets the scene run to
         the top of the screen rather than under a white bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hollowmere" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The ONLY styling that lives here, and it is not the interface's. Every
         other rule is a `.css` file imported by the module that writes the
         markup it styles (src/ui/*.css, src/editor/panel.css); a production
         build links them from this head as one hashed stylesheet, so there is
         nothing to flash. The dev server injects them from JS instead, which
         leaves one frame of default white before the first module evaluates —
         on a night game that reads as a camera flash. Background only: this
         must never grow into a second place interface rules are written. -->
    <style>
      html,
      body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
