<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` paints under a notch (the HUD keeps clear of it
         with the safe-area insets below); `user-scalable=no` is what stops a
         two-finger look from pinch-zooming the page instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HOLLOWMERE — Cel-Shaded Conquest</title>

    <!-- Installable app. The manifest asks for fullscreen landscape; the two
         apple-* tags are iOS's own equivalents, which it reads instead of the
         manifest. `black-translucent` is the one that lets the scene run to
         the top of the screen rather than under a white bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hollowmere" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* =====================================================================
         HOLLOWMERE HUD
         ---------------------------------------------------------------------
         House rules for anything added here, learned the hard way:

         - NO `border-radius` on gameplay chrome. A rounded rectangle reads as
           a web card; a military HUD is cut corners and hard edges. Panels get
           their shape from `.frame` (a chamfered hull) or from `clip-path`.
         - `clip-path` clips a CSS border away with everything else outside the
           polygon, so a chamfered panel draws its edge as a coloured layer
           with the fill inset 1px on top. `.frame` does that with two
           pseudo-elements; the flag hexagons do it with a nested `.core`.
         - Legibility comes from the scrim and text shadows, not from opaque
           panel backgrounds. The scene behind the HUD is dark, moonlit and
           moving; a solid box over it is the thing that looks bolted on.
         - Anything written every frame is a text node, a class flag or a CSS
           custom property (see HUD.ts). Per-frame `innerHTML` is a bug.
         ===================================================================== */

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* Phone browser chrome: `dvh` is the viewport as it stands with the
           URL bar showing, so the canvas is never sized to a screen that is
           partly covered. `overscroll-behavior` kills pull-to-refresh, which
           on a first-person shooter is a swipe up to look up. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      @supports (height: 100dvh) {
        html, body { height: 100dvh; }
      }
      body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        user-select: none;
        /* The gauges are positioned against #hud's PADDING box, so one rule
           here keeps every one of them out from under a notch or a home
           indicator. Resolves to 0 everywhere that has neither, so the desktop
           layout is untouched. The canvas is deliberately not inset: the scene
           should run to the glass. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        /* A condensed grotesque is what separates a military HUD from a web
           page, and every one of these ships with some desktop OS — the game
           carries no font files, the same rule as its meshes and its audio.
           Whichever lands first, the fallbacks are all narrow. */
        --font: "Bahnschrift", "DIN Alternate", "DIN Condensed",
          "Roboto Condensed", "Oswald", "Ubuntu Condensed",
          "Franklin Gothic Medium", "Arial Narrow", "Liberation Sans Narrow",
          "Nimbus Sans Narrow", "DejaVu Sans Condensed", "Segoe UI", sans-serif;
        /* Friend/foe, matching CONFIG.teams' eye colours and the minimap's
           canvas constants — warm amber against cold crimson. */
        --mine: #ffc46b;
        --theirs: #ff5a4f;
        --neutral: #aeb6c2;
        --hot: #ffe680;
        --good: #7ff08a;
        --edge: rgba(255, 255, 255, 0.22);
        --ink: rgba(8, 10, 15, 0.82);
        font-family: var(--font);
        font-variant-numeric: tabular-nums;
      }

      /* The whole HUD sits on the scene, so everything on it carries its own
         separation from a bright cobbled street or a muzzle flash. */
      #hud .cap,
      #hud .tag,
      #ticket-bar .n,
      #hud-left,
      #hud-right,
      #message,
      #killfeed,
      #lock-hint {
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
      }

      /* --- reusable chamfered panel hull ---
         ::before is the edge, ::after the fill inset 1px inside it. Both sit
         at z-index -1 in the element's own stacking context, so they paint
         behind its content and nowhere else. The cut corners are opposite
         (top-left / bottom-right): four cuts reads as a sticker, two reads as
         a machined plate. */
      .frame {
        position: relative;
        z-index: 0;
        --cham: 14px;
        --frame-edge: var(--edge);
        --frame-fill: rgba(6, 8, 13, 0.9);
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        z-index: -1;
        clip-path: polygon(
          var(--cham) 0,
          100% 0,
          100% calc(100% - var(--cham)),
          calc(100% - var(--cham)) 100%,
          0 100%,
          0 var(--cham)
        );
      }
      .frame::before { inset: 0; background: var(--frame-edge); }
      .frame::after { inset: 1px; background: var(--frame-fill); }

      /* Corner ticks, for things that own a rectangle of their own (the
         minimap, the deploy map). Cheaper than a frame and reads as a sight
         bracket rather than as a border. */
      .brackets::before,
      .brackets::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border: 2px solid var(--edge);
        pointer-events: none;
      }
      .brackets::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
      .brackets::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

      /* Micro-captions: the small all-caps labels that name a readout. */
      #hud .cap {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.5);
      }

      /* --- edge scrim ---
         Gameplay readouts live in the top and bottom bands, and the scene
         behind them is not reliably dark — snow-lit cobbles under the moon
         will swallow white text outright. A gradient at each edge buys the
         contrast without putting a box around anything. */
      #scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to bottom, rgba(0, 0, 0, 0.45), transparent 15%),
          linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent 20%);
      }

      /* --- minimap --- */
      /* Width/height are set from CONFIG.minimap.size in JS so the backing
         store and the CSS box can never drift apart and blur. The frame is a
         wrapper element (Minimap.ts) because a canvas cannot carry the corner
         brackets itself — a pseudo-element needs a container. */
      #minimap-frame {
        position: absolute;
        top: 18px;
        left: 18px;
        /* Its own stacking context, so the hull's `z-index: -1` puts it behind
           the canvas and nothing else. */
        z-index: 0;
        line-height: 0;
        opacity: 0.94;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
      }
      #minimap {
        display: block;
        /* Same cut corners as .frame, so the map reads as part of the set. */
        clip-path: polygon(
          12px 0, 100% 0, 100% calc(100% - 12px),
          calc(100% - 12px) 100%, 0 100%, 0 12px
        );
        background: #0b0e12;
      }
      /* The hull, drawn a pixel proud of the canvas on every side. */
      #minimap-frame .hull {
        position: absolute;
        inset: -1px;
        background: var(--edge);
        clip-path: polygon(
          13px 0, 100% 0, 100% calc(100% - 13px),
          calc(100% - 13px) 100%, 0 100%, 0 13px
        );
        z-index: -1;
      }
      #minimap-frame .compass {
        position: absolute;
        top: 4px;
        right: 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        line-height: 1;
        color: rgba(255, 255, 255, 0.45);
      }

      /* --- killfeed ---
         Flat lines with a colour flag on the outer edge, not bordered boxes:
         six stacked cards is a wall, six stacked lines is chatter you can
         ignore until one of them has your name on it. */
      #killfeed {
        position: absolute;
        top: 104px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        /* Names arrive as CONFIG.teams entries ("The Blight"), and mixed case
           against an all-caps HUD reads as a different piece of software. */
        text-transform: uppercase;
      }
      .kill {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 9px 4px 14px;
        border-right: 2px solid rgba(255, 255, 255, 0.28);
        background: linear-gradient(to right, transparent, rgba(6, 8, 13, 0.72));
        transition: opacity 0.6s ease-out;
        animation: killIn 0.18s ease-out;
      }
      .kill.fade { opacity: 0; }
      .kill .k { color: #e6ebf3; }
      .kill .v { color: #9aa3b1; }
      /* The kill glyph as a chamfered chip: it reads as a slot on the line
         rather than as a piece of punctuation between two names. */
      .kill .x {
        font-size: 10px;
        line-height: 1;
        padding: 3px 5px;
        color: #cfd6e2;
        background: rgba(255, 255, 255, 0.1);
        clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px);
      }
      /* Anything the player did or had done to them reads brighter. */
      .kill.mine {
        border-right-color: var(--mine);
        background: linear-gradient(to right, transparent, rgba(255, 196, 107, 0.16));
      }
      .kill.mine .k { color: var(--hot); }
      .kill.mine .x { background: rgba(255, 196, 107, 0.25); color: var(--hot); }
      @keyframes killIn {
        from { opacity: 0; transform: translateX(16px); }
      }

      /* --- scoreboard (hold Tab) --- */
      #scoreboard {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        --cham: 20px;
        --frame-fill: rgba(6, 8, 13, 0.94);
        min-width: 620px;
        padding: 0 0 15px;
      }
      #scoreboard .sb-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 26px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      #scoreboard .sb-mode {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.32em;
        color: var(--hot);
      }
      #scoreboard .sb-map {
        font-size: 11px;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.4);
      }
      #scoreboard .sb-cols,
      #scoreboard .sb-row {
        display: grid;
        grid-template-columns: 1fr 190px 74px 74px 74px;
        align-items: center;
        gap: 10px;
        padding: 0 26px;
      }
      #scoreboard .sb-cols {
        padding-top: 11px;
        padding-bottom: 5px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.38);
        text-align: right;
      }
      #scoreboard .sb-row {
        position: relative;
        padding-top: 9px;
        padding-bottom: 9px;
        font-size: 17px;
        font-weight: 700;
        text-align: right;
      }
      /* A colour flag down the left of the row, the way a team is marked in a
         real scoreboard — the row itself stays neutral so the numbers read. */
      #scoreboard .sb-row::before {
        content: "";
        position: absolute;
        left: 0;
        top: 2px;
        bottom: 2px;
        width: 4px;
        background: currentColor;
      }
      #scoreboard .sb-row.mine { color: var(--mine); }
      #scoreboard .sb-row.theirs { color: var(--theirs); }
      #scoreboard .sb-row.mine { background: rgba(255, 196, 107, 0.06); }
      #scoreboard .sb-row.theirs { background: rgba(255, 90, 79, 0.06); }
      #scoreboard .sb-name {
        text-align: left;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      #scoreboard .sb-n { color: #dfe5ee; }
      #scoreboard .sb-tickets {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
      }
      #scoreboard .sb-gauge {
        display: block;
        width: 108px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        transform: skewX(-20deg);
      }
      #scoreboard .sb-gauge u { display: block; height: 100%; background: currentColor; }
      #scoreboard .sb-you {
        display: flex;
        align-items: baseline;
        gap: 18px;
        margin: 12px 26px 0;
        padding-top: 11px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 11px;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.55);
      }
      #scoreboard .sb-you .sb-label { color: var(--hot); font-weight: 700; }
      #scoreboard .sb-you b {
        font-size: 17px;
        color: #fff;
        margin-right: 5px;
      }

      /* --- deploy screen --- */
      /* #hud is pointer-events:none so the HUD never eats a game click; this
         overlay is the one thing that has to opt back in. */
      #deploy {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at center, rgba(6, 8, 14, 0.72), rgba(3, 4, 8, 0.94)),
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.022) 0 1px,
            transparent 1px 3px
          );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Tighter than it looks like it wants to be: the map, the status line
           and the kit button together have to clear a 720p window, and this
           screen has no scroll to fall back on. */
        gap: 14px;
        pointer-events: auto;
      }
      #deploy h2 {
        position: relative;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.55em;
        color: var(--hot);
        padding: 0 26px;
      }
      /* Rules either side of the heading — a title bar without a box. */
      #deploy h2::before,
      #deploy h2::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 54px;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(255, 230, 128, 0.55));
      }
      #deploy h2::before { right: 100%; }
      #deploy h2::after {
        left: 100%;
        background: linear-gradient(to left, transparent, rgba(255, 230, 128, 0.55));
      }
      /* Same hull-behind-canvas trick as the minimap, and for the same reason:
         a canvas cannot draw its own chamfered edge or corner brackets. */
      #deploy .map-wrap { position: relative; z-index: 0; line-height: 0; }
      /* Height-led rather than square-led: the column above and below it is
         all fixed-height, so the viewport's height is the only thing the map
         can give ground to. */
      #deploy-map {
        width: min(56vh, 60vw);
        height: min(56vh, 60vw);
        display: block;
        cursor: crosshair;
        image-rendering: auto;
        clip-path: polygon(
          22px 0, 100% 0, 100% calc(100% - 22px),
          calc(100% - 22px) 100%, 0 100%, 0 22px
        );
      }
      #deploy .map-wrap .hull {
        position: absolute;
        inset: -1px;
        z-index: -1;
        background: var(--edge);
        clip-path: polygon(
          23px 0, 100% 0, 100% calc(100% - 23px),
          calc(100% - 23px) 100%, 0 100%, 0 23px
        );
      }
      #deploy-status {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: rgba(255, 255, 255, 0.55);
        padding: 7px 18px;
        border-left: 2px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.04);
      }
      #deploy-status.ready {
        color: var(--hot);
        border-left-color: var(--hot);
        background: rgba(255, 230, 128, 0.1);
        animation: pulse 1.4s ease-in-out infinite;
      }

      /* --- conquest: the reinforcement gauge ---
         Two counts with a gauge each, draining away from the centre. The bar
         is the fraction of the round's starting pool still standing, so "we
         are losing" is a shape rather than a subtraction. */
      #ticket-bar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #ticket-bar .side {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 168px;
      }
      #ticket-bar .side.mine { justify-content: flex-end; }
      #ticket-bar .tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.55);
      }
      #ticket-bar .n {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.03em;
        line-height: 1;
      }
      #ticket-bar .side.mine .n { color: var(--mine); }
      #ticket-bar .side.theirs .n { color: var(--theirs); }
      /* Running out is the round ending, so it gets the one animated readout
         in the top band. */
      #ticket-bar .n.critical { animation: pulse 0.9s ease-in-out infinite; }
      #ticket-bar .gauge { display: flex; gap: 5px; }
      #ticket-bar .track {
        position: relative;
        width: 108px;
        height: 7px;
        background: rgba(255, 255, 255, 0.11);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        transform: skewX(-20deg);
      }
      #ticket-bar .track i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        transition: width 0.4s linear;
      }
      /* Both fills are anchored at the centre of the pair, so the two teams
         meet in the middle at full strength and retreat outward as they bleed. */
      #ticket-bar .track.mine i { right: 0; background: var(--mine); }
      #ticket-bar .track.theirs i { left: 0; background: var(--theirs); }

      /* --- conquest: the A..E flag strip ---
         A hexagon per point, filling from the bottom with the capture meter.
         `clip-path` clips a border away, so the coloured hull IS the outer
         element and `.core` is the dark inset that leaves a 2px rim. */
      #flag-strip {
        position: absolute;
        top: 58px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
      }
      .flag {
        --hex: polygon(50% 0, 100% 26%, 100% 74%, 50% 100%, 0 74%, 0 26%);
        position: relative;
        width: 36px;
        height: 42px;
        clip-path: var(--hex);
        background: var(--neutral);
      }
      .flag.mine { background: var(--mine); }
      .flag.theirs { background: var(--theirs); }
      .flag .core {
        position: absolute;
        inset: 2px;
        clip-path: var(--hex);
        background: rgba(6, 8, 13, 0.88);
        overflow: hidden;
      }
      .flag .cap-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0;
        opacity: 0.55;
        transition: height 0.15s linear;
      }
      .flag .cap-fill.mine { background: var(--mine); }
      .flag .cap-fill.theirs { background: var(--theirs); }
      .flag .id {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #d3d9e2;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .flag.mine .id { color: var(--mine); }
      .flag.theirs .id { color: var(--theirs); }
      /* A contested flag pulses so it reads from the corner of the eye. It has
         to be `drop-shadow` and not `box-shadow`: the hull is clipped to the
         hexagon, and a box shadow is clipped away with the corners.
         `#capture-status` borrows the same keyframes for the same reason. */
      .flag.contested { animation: flagPulse 0.7s ease-in-out infinite alternate; }
      @keyframes flagPulse {
        from { filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
        to { filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85)); }
      }

      /* --- conquest: the "you are standing in it" panel ---
         Shown only while the player is inside a capture zone. The ring drawn
         on the ground says where the boundary is; this says which side of it
         you are on, so it sits low and centred, under the crosshair and clear
         of the vitals and ammo. */
      #capture-status {
        position: absolute;
        left: 50%;
        bottom: 104px;
        transform: translateX(-50%);
        width: 288px;
        padding: 8px 12px 9px;
        text-align: center;
        --cham: 11px;
      }
      #capture-status .cap-head {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      /* The letter as a chamfered chip, matching the flag strip's cells. */
      #capture-status .cap-id {
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        padding: 4px 7px;
        color: #12141a;
        background: var(--neutral);
        clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
      }
      #capture-status .cap-name {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.26em;
        color: rgba(255, 255, 255, 0.85);
      }
      #capture-status.mine .cap-id { background: var(--mine); }
      #capture-status.theirs .cap-id { background: var(--theirs); }
      #capture-status .cap-meter {
        position: relative;
        height: 7px;
        margin: 7px 0 6px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      #capture-status .cap-meter-fill {
        height: 100%;
        width: 0;
        transition: width 0.15s linear;
      }
      #capture-status .cap-meter-fill.mine { background: var(--mine); }
      #capture-status .cap-meter-fill.theirs { background: var(--theirs); }
      /* Notches over the fill: a segmented meter reads as an instrument, and
         the ticks give the eye something to measure progress against. */
      #capture-status .cap-meter .ticks {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to right,
          transparent 0 10px,
          rgba(0, 0, 0, 0.5) 10px 11px
        );
      }
      #capture-status .cap-state {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.9);
      }
      #capture-status.contested {
        --frame-edge: rgba(255, 90, 79, 0.75);
        animation: flagPulse 0.7s ease-in-out infinite alternate;
      }
      #capture-status.contested .cap-state { color: var(--theirs); }

      /* --- bottom band: vitals and ammunition ---
         Deliberately un-panelled. The old version was two bordered cards, and
         a bordered card over a 3D scene is the single thing that makes a HUD
         look like a web page. The scrim carries the legibility instead. */
      #hud-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 26px 34px;
      }
      #hud-left { display: flex; flex-direction: column; gap: 5px; }
      #hud-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }
      #hud-left .cap-row,
      #hud-right .cap-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      /* The skew is the signature of the set: bars, gauges and magazine ticks
         all lean the same 20 degrees, which is what ties the top band to the
         bottom one without drawing a single box. */
      .hp-bar {
        position: relative;
        width: 224px;
        height: 11px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        transform: skewX(-20deg);
      }
      #health-fill {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(to bottom, #b6ffc4, var(--good));
        transition: width 0.12s ease-out;
      }
      .hp-bar .segs {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to right,
          transparent 0 21px,
          rgba(0, 0, 0, 0.5) 21px 23px
        );
      }
      .hp-bar.low #health-fill { background: linear-gradient(to bottom, #ff9a92, var(--theirs)); }
      .hp-bar.low { animation: lowPulse 0.8s ease-in-out infinite alternate; }
      @keyframes lowPulse {
        from { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55); }
        to { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55), 0 0 10px rgba(255, 90, 79, 0.65); }
      }
      .hp-num { display: flex; align-items: baseline; gap: 6px; }
      #health-text {
        font-size: 34px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: 0.02em;
      }
      #health-text.low { color: var(--theirs); }
      .hp-num em {
        font-style: normal;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: rgba(255, 255, 255, 0.45);
      }

      #hud-right .ammo { display: flex; align-items: baseline; gap: 8px; }
      #ammo-mag {
        font-size: 46px;
        font-weight: 800;
        line-height: 0.85;
        letter-spacing: 0.01em;
      }
      #ammo-mag.low { color: var(--theirs); }
      #ammo-cap {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.42);
      }
      /* One tick per round left in the magazine. The count is legible without
         reading the number, which is what the strip is for — the number is the
         confirmation, not the reading. */
      #mag-strip {
        position: relative;
        display: flex;
        gap: 2px;
        height: 13px;
        overflow: hidden;
        transform: skewX(-20deg);
      }
      #mag-strip i {
        display: block;
        width: 5px;
        height: 100%;
        background: var(--hot);
        box-shadow: 0 0 4px rgba(255, 230, 128, 0.35);
      }
      #mag-strip i.spent {
        background: rgba(255, 255, 255, 0.13);
        box-shadow: none;
      }
      #hud-right .reload-note {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.26em;
        color: var(--hot);
        opacity: 0;
      }
      #hud-right.reloading .reload-note { opacity: 1; }
      #hud-right.reloading .ammo { opacity: 0.3; }
      /* A sweep across the strip while the magazine is being changed. The 1.4s
         cycle mirrors the RIFLE's `CONFIG.weapons.rifle.reloadTime` so one
         pass ≈ one reload; the SMG's is a little shorter and the sweep simply
         runs on. It is cosmetic, and nothing reads it back. */
      #hud-right.reloading #mag-strip::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 230, 128, 0.75),
          transparent
        );
        animation: magSweep 1.4s linear infinite;
      }
      @keyframes magSweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }

      /* --- crosshair ---
         Four ticks around a centre dot. The GAP between them is the live
         bullet spread: HUD.setCrosshair writes `--sp` once per frame and all
         four ticks read it off, so recoil bloom is the crosshair opening up.
         No transition on opacity — the ADS blend is already eased, and a
         second easing on top of it lags the sight it is handing over to. */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        --sp: 26px;
      }
      #crosshair i {
        position: absolute;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.65), 0 0 3px rgba(0, 0, 0, 0.9);
        transition: transform 0.08s linear;
      }
      #crosshair i.t,
      #crosshair i.b { width: 2px; height: 9px; margin: -4.5px 0 0 -1px; }
      #crosshair i.l,
      #crosshair i.r { width: 9px; height: 2px; margin: -1px 0 0 -4.5px; }
      #crosshair i.t { transform: translateY(calc(var(--sp) / -2 - 5px)); }
      #crosshair i.b { transform: translateY(calc(var(--sp) / 2 + 5px)); }
      #crosshair i.l { transform: translateX(calc(var(--sp) / -2 - 5px)); }
      #crosshair i.r { transform: translateX(calc(var(--sp) / 2 + 5px)); }
      #crosshair .dot {
        position: absolute;
        width: 3px;
        height: 3px;
        margin: -1.5px 0 0 -1.5px;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7);
      }

      /* --- hitmarker ---
         Four diagonal ticks, the shooter convention. The kill variant is red
         and is the cue to stop shooting a body that is already going down.
         The pop is written as a transform by HUD.update rather than run as a
         keyframe: at full auto it re-triggers several times a second, and
         restarting a CSS animation needs a forced reflow each time. */
      #hitmarker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        transform: translate(-50%, -50%);
      }
      #hitmarker i {
        position: absolute;
        width: 2px;
        height: 9px;
        margin: -4.5px 0 0 -1px;
        background: #fff;
        box-shadow: 0 0 3px rgba(0, 0, 0, 0.95);
      }
      #hitmarker i:nth-child(1) { transform: rotate(45deg) translateY(-11px); }
      #hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(-11px); }
      #hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(-11px); }
      #hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(-11px); }
      #hitmarker.kill i {
        background: var(--theirs);
        height: 11px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.95);
      }

      /* --- damage vignette --- */
      #vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, 0.85) 100%);
      }

      /* --- directional damage arcs ---
         One pooled element per live arc, centred on the crosshair and rotated
         by HUD.update() every frame; opacity and rotation are the only things
         written per frame, so this stays a compositor-only change. */
      #damage-dirs {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
      }
      #damage-dirs .arc {
        position: absolute;
        top: -150px;
        left: -150px;
        width: 300px;
        height: 300px;
        display: none;
        opacity: 0;
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9));
      }
      #damage-dirs .arc path {
        fill: #a5120a;
        stroke: rgba(0, 0, 0, 0.7);
        stroke-width: 1.2;
      }

      /* --- centre message (flag captured, and so on) --- */
      #message {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-align: center;
        white-space: nowrap;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
        border-bottom: 1px solid rgba(255, 255, 255, 0.22);
        animation: msgIn 0.25s ease-out;
      }
      @keyframes msgIn {
        from { opacity: 0; letter-spacing: 0.5em; }
      }

      /* --- toasts ---
         The bottom-centre column is a stack, and the offsets have to clear
         each other because all three can be on screen at once: the lock hint
         at 58, the capture panel at 104 (about 72 tall), toasts above that.
         The vitals and ammo are anchored to the corners, so the centre lane is
         theirs alone. */
      #toasts {
        position: absolute;
        bottom: 194px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .toast {
        padding: 6px 15px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        /* Same reason as the killfeed: the text is a ControlPoint's own name. */
        text-transform: uppercase;
        color: var(--hot);
        background: rgba(6, 8, 13, 0.72);
        border-left: 2px solid var(--hot);
        transition: opacity 0.7s;
        animation: killIn 0.2s ease-out;
      }
      .toast.fade { opacity: 0; }

      #lock-hint {
        position: absolute;
        bottom: 58px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: rgba(255, 255, 255, 0.65);
      }
      #lock-hint b { color: var(--hot); }

      /* --- short viewports (a phone held sideways) ---
         The menu and the deploy map stack a title, a picker, a table and a
         prompt, they are sized in px for a 720p window, and NOTHING in this
         HUD scrolls — so on a 350px-tall landscape phone the stack simply
         runs off both ends. The fix is to draw the whole screen at the size
         it was authored for and scale it down: the box is grown by 1/s so
         that scaling it by s about the top-left lands exactly on the
         viewport again, which keeps the backdrop full-bleed. At the default
         s = 1 both the size and the transform are identities, so a desktop
         layout is untouched pixel for pixel.

         `#loadout` is deliberately NOT in this list. Its stage is a hole in
         the scrim that the 3D turntable is placed through, back-projected
         from the SAME viewport fractions the CSS uses (see
         CONFIG.viewmodel.inspect) — a transform would move the hole and
         leave the weapon behind it. */
      #hud { --ov-scale: 1; }
      @media (max-height: 620px) { #hud { --ov-scale: 0.75; } }
      @media (max-height: 430px) { #hud { --ov-scale: 0.45; } }
      #overlay, #deploy {
        width: calc(100% / var(--ov-scale));
        height: calc(100% / var(--ov-scale));
        transform: scale(var(--ov-scale));
        transform-origin: top left;
      }

      /* --- overlays (menu / round over / pause) --- */
      #overlay {
        position: absolute;
        inset: 0;
        /* The minimap and the deploy screen are appended to #hud AFTER its
           markup, so in DOM order they paint over this. The pause menu can be
           opened with either of them on screen, and an overlay you can see
           through a map is not an overlay. */
        z-index: 10;
        background:
          radial-gradient(ellipse at center, rgba(6, 8, 14, 0.78), rgba(2, 3, 6, 0.96)),
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 0 1px,
            transparent 1px 3px
          );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* The menu stacks title, difficulty, the kit button, controls and
           prompt. There is no scroll here either, so the gap is what keeps
           all five inside a 720p window. */
        gap: 20px;
        text-align: center;
      }
      #overlay .ov-title { display: flex; flex-direction: column; gap: 10px; }
      #overlay h1 {
        font-size: 76px;
        font-weight: 900;
        letter-spacing: 0.22em;
        /* Indented so the tracking doesn't push the block off-centre. */
        text-indent: 0.22em;
        color: var(--hot);
        text-shadow: 5px 5px 0 #000, -2px -2px 0 #35f0ff;
      }
      /* The pause title is deliberately smaller than the menu's and the result
         screen's: those hide the HUD, this one is a header inside a running
         round and has to clear the flag strip along the top of it. */
      #overlay h1.pause-title { font-size: 44px; }
      #overlay h1.dead { color: var(--theirs); text-shadow: 5px 5px 0 #000; }
      #overlay h1.win { color: var(--good); text-shadow: 5px 5px 0 #000; }
      #overlay .tagline {
        font-size: 13px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      #overlay .prompt {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #35f0ff;
        animation: pulse 1.4s ease-in-out infinite;
      }

      /* The overlay itself stays pointer-events:none (inherited from #hud);
         only this row opts back in, so a click anywhere else is still the
         game's. */
      #overlay .difficulty {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #overlay .difficulty .tiers { display: flex; gap: 6px; }
      #overlay .difficulty .label,
      #overlay .difficulty .hint {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      #overlay .difficulty button.tier {
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 8px 18px;
        color: #cdd6e6;
        background: rgba(255, 255, 255, 0.05);
        border: 0;
        cursor: pointer;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        transition: background 0.12s, color 0.12s;
      }
      #overlay .difficulty button.tier:hover {
        background: rgba(255, 230, 128, 0.18);
        color: var(--hot);
      }
      #overlay .difficulty button.tier.on {
        color: #12141a;
        background: var(--hot);
      }

      /* --- the loadout button, on the menu and on the deploy screen ---
         Both open the same screen, so both read the same: a label, the kit
         currently in the player's hands, and the key that gets there. The
         menu's `#overlay` is pointer-events:none (inherited from #hud), so
         the row claims them for itself — the same carve-out the difficulty
         picker and the pause actions get. #deploy already opts in for its
         whole area. */
      #overlay .kit {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #overlay .kit .label,
      #overlay .kit .hint {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      #overlay button.kit-open,
      #deploy-kit {
        font: inherit;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 20px;
        color: #cdd6e6;
        background: rgba(255, 255, 255, 0.05);
        border: 0;
        cursor: pointer;
        text-align: left;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        transition: background 0.12s, color 0.12s;
      }
      #overlay button.kit-open b,
      #deploy-kit b {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #overlay button.kit-open i,
      #deploy-kit i {
        font-style: normal;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      #overlay button.kit-open:hover,
      #deploy-kit:hover {
        background: rgba(255, 230, 128, 0.18);
        color: var(--hot);
      }
      /* On the deploy screen the label rides above the kit, because the row
         there is a single button rather than a labelled control in a row. */
      #deploy-kit { flex-direction: row; align-items: baseline; gap: 14px; }
      #deploy-kit .lbl {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }

      /* --- the loadout screen ---
         A screen of its own rather than a row under the menu: there are two
         slots and a stat chart now, and both places it is reachable from (the
         main menu and the deploy screen) already have a column of their own
         that will not take another panel.

         Above #overlay's z-index, because the menu is one of the things it
         covers. It is deliberately absent from the pause menu: a round you
         are standing in is not somewhere you get to change what you carry.

         TWO COLUMNS, and the right one is a hole. The weapon on the stage is
         the live viewmodel drawn by the scene on the canvas UNDER this whole
         overlay, so the stage half carries no background of its own — the
         scrim stops before it and only a vignette frames it.

         `--panel` is therefore load-bearing outside this file: the stage takes
         the rest of the width, so its centre sits `(1 + panel) / 2` across,
         which in NDC (2x - 1) is exactly `panel` — 0.46, the anchor
         `CONFIG.viewmodel.inspect` places the weapon at. Both are fractions of
         the viewport, so a resize moves them together; change one without the
         other and the weapon drifts off its own stage. */
      #loadout {
        position: absolute;
        inset: 0;
        z-index: 11;
        --panel: 46%;
        display: flex;
        align-items: stretch;
        pointer-events: auto;
      }
      /* The scrim is a child rather than #loadout's own background because it
         has to stop: opaque under the panel, gone before the stage. A backdrop
         over the stage would dim the weapon along with the world behind it —
         everything here is above the canvas.

         It ends on a rule rather than fading out over the stage. A soft ramp
         across a live scene is a soft ramp against whatever brightness happens
         to be behind it, which reads as a smear the width of a hand; a hard
         edge with a lit line on it reads as the side of a panel. */
      #loadout .lo-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to right,
            rgba(2, 3, 6, 0.985) 0%,
            rgba(4, 6, 13, 0.97) 70%,
            rgba(4, 6, 13, 0.94) 100%
          ),
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 0 1px,
            transparent 1px 3px
          );
        right: calc(100% - var(--panel));
        border-right: 1px solid rgba(255, 255, 255, 0.09);
      }
      #loadout .lo-panel {
        position: relative;
        flex: 0 0 var(--panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 26px;
      }
      /* The stage: a frame around a hole, and the drag handle for the weapon in
         it. The vignette darkens the world at the edges without touching the
         middle, where the weapon is — a flat wash over it would dim the
         weapon just as much as the village behind. */
      #loadout .lo-stage {
        position: relative;
        flex: 1 1 auto;
        cursor: grab;
        background: radial-gradient(
          ellipse 44% 48% at 50% 44%,
          rgba(3, 4, 10, 0.5) 42%,
          rgba(3, 4, 10, 0.93) 100%
        );
      }
      #loadout .lo-stage.turning { cursor: grabbing; }
      /* Corner ticks, so the hole reads as a bay the weapon is standing in
         rather than as a gap where the panel failed to load. */
      #loadout .lo-stage::before,
      #loadout .lo-stage::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(255, 230, 128, 0.3);
      }
      #loadout .lo-stage::before {
        top: 15%;
        left: 8%;
        border-right: 0;
        border-bottom: 0;
      }
      #loadout .lo-stage::after {
        bottom: 15%;
        right: 8%;
        border-left: 0;
        border-top: 0;
      }
      #loadout .lo-stage-cap,
      #loadout .lo-stage-hint {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        text-transform: uppercase;
      }
      #loadout .lo-stage-cap {
        bottom: 21%;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.26em;
        color: var(--hot);
      }
      #loadout .lo-stage-hint {
        bottom: 17%;
        font-size: 9px;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.34);
      }
      /* While the kit is up, everything else under #hud goes dark — the menu,
         the deploy map, the gauges, the crosshair, all of it. The weapon on the
         stage is NOT DOM: it is drawn by the scene on the canvas below every
         one of these, so anything left standing paints over it. The menu's own
         backdrop is nearly opaque, which is why its ghost through the scrim was
         never doing any work anyway; the crosshair sitting in the middle of a
         kit screen was doing worse than nothing. */
      #hud.kitting > *:not(#loadout) { visibility: hidden; }
      /* Same rules-either-side heading as the deploy screen's. */
      #loadout h2 {
        position: relative;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.55em;
        color: var(--hot);
        padding: 0 26px;
      }
      #loadout h2::before,
      #loadout h2::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 54px;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(255, 230, 128, 0.55));
      }
      #loadout h2::before { right: 100%; }
      #loadout h2::after {
        left: 100%;
        background: linear-gradient(to left, transparent, rgba(255, 230, 128, 0.55));
      }
      /* Sized to the panel column it now sits in rather than to the viewport:
         the stage owns the other half of the screen. */
      #loadout .lo-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 620px;
        text-align: left;
      }
      #loadout .lo-slots { display: flex; flex-direction: column; gap: 6px; }
      /* The active row is the one the arrow keys are stepping. It is marked
         with a bar and a wash rather than with a focus ring, because the
         selection is the screen's own and not the browser's. */
      #loadout .lo-slot {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 12px;
        border-left: 2px solid transparent;
        transition: background 0.12s, border-color 0.12s;
      }
      #loadout .lo-slot.active {
        border-left-color: var(--hot);
        background: rgba(255, 255, 255, 0.045);
      }
      #loadout .lo-slot-name {
        flex: 0 0 auto;
        width: 62px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      #loadout .lo-opts { display: flex; gap: 6px; flex: 1 1 auto; }
      #loadout button.lo-opt {
        font: inherit;
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 14px;
        color: #cdd6e6;
        background: rgba(255, 255, 255, 0.05);
        border: 0;
        cursor: pointer;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        transition: background 0.12s, color 0.12s;
      }
      #loadout button.lo-opt b {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      /* The figures under each name — the magnification as a lens is marked,
         and the weapon's damage, rate and fire mode. Tabular so the buttons
         line their numbers up rather than shuffling by a pixel each. */
      #loadout button.lo-opt i {
        font-style: normal;
        font-size: 10px;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      #loadout button.lo-opt:hover {
        background: rgba(255, 230, 128, 0.18);
        color: var(--hot);
      }
      #loadout button.lo-opt.on { color: #12141a; background: var(--hot); }
      #loadout button.lo-opt.on i { color: rgba(18, 20, 26, 0.6); }

      /* The chart and the copy, side by side. Held at a fixed height: the
         blurbs are different lengths, and a panel that changes height as you
         arrow across it drags the whole centred column up and down. */
      #loadout .lo-detail {
        display: flex;
        /* Wraps rather than squeezing: the chart's bar column is the flexible
           one, so in a narrow panel a row that stays side by side hands the
           bars a couple of pixels and the chart silently becomes a list of
           numbers. Stacked, both halves keep their width. */
        flex-wrap: wrap;
        gap: 22px;
        padding: 16px 20px;
        min-height: 168px;
      }
      #loadout .lo-stats {
        flex: 1 1 210px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 7px;
      }
      #loadout .lo-stat {
        display: grid;
        grid-template-columns: 72px 1fr 52px;
        align-items: center;
        gap: 10px;
      }
      #loadout .lo-stat-name {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      /* Each bar is that weapon's figure against the best any weapon has, so
         the chart re-scales itself if a third one is ever added. */
      #loadout .lo-bar {
        display: block;
        height: 5px;
        background: rgba(255, 255, 255, 0.09);
      }
      #loadout .lo-bar u {
        display: block;
        height: 100%;
        background: var(--hot);
        transition: width 0.16s ease-out;
      }
      #loadout .lo-stat-val {
        font-size: 11px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: #cfd6e2;
      }
      #loadout .lo-blurbs {
        flex: 1 1 240px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      #loadout .lo-blurb {
        font-size: 11px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.55);
      }
      #loadout .lo-blurb.dim {
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.38);
      }
      #loadout .lo-foot {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
      }
      #loadout kbd {
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 3px 7px;
        margin-right: 4px;
        color: #cfd6e2;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
      }
      #loadout button.lo-back {
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 6px 14px;
        color: var(--hot);
        background: rgba(255, 230, 128, 0.1);
        border: 0;
        cursor: pointer;
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      }
      #loadout button.lo-back:hover { background: rgba(255, 230, 128, 0.22); }

      /* The pause menu's action list. Same carve-out as the difficulty row —
         the buttons take pointer events, the overlay around them does not. */
      #overlay .pause-actions {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 280px;
      }
      #overlay button.pact {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 12px 22px;
        color: #cdd6e6;
        background: rgba(255, 255, 255, 0.05);
        border: 0;
        cursor: pointer;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        transition: background 0.12s, color 0.12s;
      }
      /* Selection is filled, hover is only warm: the keyboard's idea of where
         it is has to stay readable while the mouse is somewhere else. Hover
         moves the selection anyway (see HUD.showPause), so the two only differ
         for the frame between entering a button and the class landing. */
      #overlay button.pact:hover {
        background: rgba(255, 230, 128, 0.18);
        color: var(--hot);
      }
      #overlay button.pact.on {
        color: #12141a;
        background: var(--hot);
      }

      /* Controls as a key-cap table: three columns, action / keyboard / pad. */
      #overlay .ov-controls {
        --cham: 16px;
        padding: 16px 26px 18px;
        min-width: 470px;
      }
      #overlay .ov-controls-head,
      #overlay .ctl {
        display: grid;
        grid-template-columns: 1fr 168px 96px;
        align-items: center;
        gap: 12px;
        text-align: left;
      }
      #overlay .ov-controls-head {
        padding-bottom: 8px;
        margin-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      #overlay .ctl { padding: 3px 0; }
      #overlay .ctl-act {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #dfe5ee;
      }
      #overlay .ctl-keys,
      #overlay .ctl-pad { display: flex; gap: 4px; }
      #overlay kbd {
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 4px 8px;
        min-width: 26px;
        text-align: center;
        color: #cfd6e2;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
      }
      #overlay kbd.pad { color: var(--hot); box-shadow: inset 0 0 0 1px rgba(255, 230, 128, 0.3); }

      #overlay .ov-result {
        --cham: 14px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 26px;
      }
      #overlay .ov-result .lbl {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: rgba(255, 255, 255, 0.45);
      }
      #overlay .ov-result .vals { display: flex; align-items: baseline; gap: 10px; }
      #overlay .ov-result b { font-size: 24px; font-weight: 800; }
      #overlay .ov-result b:first-of-type { color: var(--mine); }
      #overlay .ov-result b:last-of-type { color: var(--theirs); }
      #overlay .ov-result i {
        font-style: normal;
        color: rgba(255, 255, 255, 0.3);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* --- behind a full-screen overlay ---
         The menu and the round-over card sit over a live scene, so last
         round's gauges and killfeed read through them and make the HUD look
         like it is still running. HUD.setOverlaid() puts .overlaid on #hud;
         the deploy screen deliberately does not use it — tickets and flags are
         what you are picking a spawn against. */
      #hud.overlaid #ticket-bar,
      #hud.overlaid #flag-strip,
      #hud.overlaid #capture-status,
      #hud.overlaid #crosshair,
      #hud.overlaid #hitmarker,
      #hud.overlaid #damage-dirs,
      #hud.overlaid #hud-bottom,
      #hud.overlaid #killfeed,
      #hud.overlaid #message,
      #hud.overlaid #toasts { display: none; }

      /* --- paused ---
         Unlike .overlaid, this keeps the gauges, the flag strip and the vitals:
         under a pause they are this round's and still true, and the frozen
         scene behind them is the one they describe. What goes is what would be
         lying — a crosshair with nothing to shoot, a hitmarker and damage arcs
         stopped mid-decay, and the hint telling you to click for a mouse you
         have already got. */
      /* The pause overlay is the one that swallows clicks. Everywhere else the
         overlay stays inert and only its buttons opt in — but the deploy map
         underneath takes pointer events of its own, and a click through the
         empty half of a pause screen must not deploy the player. */
      #hud.paused #overlay { pointer-events: auto; }
      #hud.paused #crosshair,
      #hud.paused #hitmarker,
      #hud.paused #damage-dirs,
      #hud.paused #capture-status,
      #hud.paused #lock-hint { display: none; }

      /* --- map editor (dev only) --- */
      /* The gameplay chrome is meaningless with no player, and the crosshair
         actively gets in the way of clicking things. HUD.setEditing() puts
         .editing on #hud; hiding here rather than per element means update()
         can keep writing to those nodes without fighting the toggle. */
      #hud.editing #scrim,
      #hud.editing #ticket-bar,
      #hud.editing #flag-strip,
      #hud.editing #capture-status,
      #hud.editing #crosshair,
      #hud.editing #hitmarker,
      #hud.editing #damage-dirs,
      #hud.editing #hud-bottom,
      #hud.editing #killfeed,
      #hud.editing #lock-hint { display: none; }

      /* The editor keeps the old interface font on purpose: it is a dense
         numeric tool, not part of the game's presentation, and it should not
         move when the HUD is restyled. */
      #editor-panel { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

      /* Same opt-in as #deploy: #hud is pointer-events:none. */
      #editor-panel {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 240px;
        padding: 12px 14px;
        background: rgba(6, 8, 14, 0.9);
        border: 2px solid #000;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        pointer-events: auto;
        font-size: 12px;
      }
      /* Terrain mode owns the pointer, so it has to be unmistakable from the
         corner of the eye — a mode you forget you are in makes every click in
         the viewport feel broken. */
      #editor-panel.ed-mode-terrain {
        border-color: #c58cff;
        box-shadow: 0 0 0 1px rgba(197, 140, 255, 0.5);
      }
      /* And one level down: sculpt and level both answer a left drag and do
         different things with it, so the panel carries the armed tool's colour
         the same way the brush itself does. */
      #editor-panel.ed-mode-terrain.ed-tool-level {
        border-color: #ff9ad5;
        box-shadow: 0 0 0 1px rgba(255, 154, 213, 0.5);
      }
      #editor-panel.ed-mode-terrain.ed-tool-level #ed-tool {
        color: #ff9ad5;
      }
      #editor-panel h2 {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #35f0ff;
        margin-bottom: 10px;
      }
      #editor-panel .ed-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        font-variant-numeric: tabular-nums;
      }
      #editor-panel .ed-key {
        color: #ffe680;
        letter-spacing: 2px;
        opacity: 0.75;
      }
      #editor-panel .ed-warn {
        margin-top: 8px;
        padding: 5px 7px;
        border-left: 2px solid #ff5a4f;
        background: rgba(255, 90, 79, 0.08);
        font-size: 10px;
        line-height: 1.4;
        opacity: 0.65;
      }
      #editor-panel .ed-status {
        margin-top: 8px;
        padding: 4px 7px;
        font-size: 11px;
        letter-spacing: 1px;
        border-left: 2px solid currentColor;
      }
      #editor-panel .ed-status.idle { color: #8a93a6; }
      #editor-panel .ed-status.busy { color: #ffe680; }
      #editor-panel .ed-status.ok { color: #7fd66a; }
      #editor-panel .ed-status.error { color: #ff5a4f; }
      #editor-panel .ed-add {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #editor-panel .ed-add .ed-title { width: 100%; margin-bottom: 2px; }
      #editor-panel .ed-add select { flex: 1 1 0; min-width: 0; }
      #editor-panel .ed-add button { width: 100%; }
      #editor-panel input,
      #editor-panel select,
      #editor-panel button {
        font: inherit;
        font-size: 11px;
        letter-spacing: 1px;
        color: #dfe6f2;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 2px 4px;
      }
      #editor-panel input:focus,
      #editor-panel select:focus {
        outline: none;
        border-color: #35f0ff;
      }
      #editor-panel input::placeholder { color: #8a93a6; opacity: 0.8; }
      #editor-panel button {
        cursor: pointer;
        color: #ffe680;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      #editor-panel button:hover { background: rgba(255, 230, 128, 0.16); }
      #editor-panel .ed-field input[type="number"],
      #editor-panel .ed-field input[type="text"],
      #editor-panel .ed-field select {
        width: 108px;
        text-align: right;
      }
      #editor-panel .ed-field input[type="checkbox"] {
        width: auto;
        accent-color: #35f0ff;
      }
      #editor-panel .ed-field { align-items: center; }
      #editor-panel .ed-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      #editor-panel .ed-delete {
        color: #ff5a4f;
        padding: 1px 6px;
      }
      #editor-panel .ed-delete:hover { background: rgba(255, 90, 79, 0.18); }
      #editor-panel .ed-inspector {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
      }
      #editor-panel .ed-title {
        color: #35f0ff;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
      #editor-panel .ed-findings {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        max-height: 34vh;
        overflow-y: auto;
      }
      #editor-panel .ed-finding {
        padding: 3px 6px;
        margin-bottom: 3px;
        font-size: 11px;
        line-height: 1.35;
        cursor: pointer;
        border-left: 2px solid currentColor;
        background: rgba(255, 255, 255, 0.04);
      }
      #editor-panel .ed-finding:hover { background: rgba(255, 255, 255, 0.12); }
      #editor-panel .ed-finding.error { color: #ff5a4f; }
      #editor-panel .ed-finding.warning { color: #ffc46b; }
      #editor-panel .ed-finding.info { color: #8a93a6; }
      #editor-panel .ed-ok { color: #7fd66a; font-size: 11px; letter-spacing: 1px; }
      #editor-panel .ed-help {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        line-height: 1.7;
        opacity: 0.6;
      }
      #editor-panel .ed-help b { color: #ffc46b; font-weight: 700; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
