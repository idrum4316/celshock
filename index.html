<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CELSHOCK — Cel-Shaded Roguelike Shooter</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        user-select: none;
      }

      /* --- room counter --- */
      #room-info {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        text-shadow: 0 2px 0 #000;
        opacity: 0.9;
      }

      /* --- boss bar --- */
      #boss-bar-wrap {
        position: absolute;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 70vw);
        text-align: center;
      }
      #boss-name {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 4px;
        margin-bottom: 5px;
        color: #ff5a4f;
        text-shadow: 0 2px 0 #000;
      }

      /* --- bars --- */
      .bar {
        height: 14px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid #000;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
      .bar .fill {
        height: 100%;
        width: 100%;
        background: #5aff7a;
        transition: width 0.12s ease-out;
      }
      .bar .fill.low { background: #ff5a4f; }
      .bar.boss { height: 16px; }
      .bar.boss .fill { background: #ff5a4f; }

      /* --- bottom panels --- */
      #hud-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 22px 28px;
      }
      .panel {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #000;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 10px 16px;
        min-width: 220px;
      }
      .panel.right {
        min-width: 130px;
        text-align: right;
      }
      .panel .label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 4px;
      }
      #health-text {
        font-size: 12px;
        margin-top: 4px;
        opacity: 0.85;
      }
      #ammo-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 0 #000;
      }
      #ammo-text.reloading { font-size: 16px; color: #ffb400; }

      /* --- crosshair --- */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #crosshair .dot {
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #000;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
      }
      #crosshair .ring {
        display: block;
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.6);
        border-radius: 50%;
        transition: width 0.12s, height 0.12s, opacity 0.12s;
      }
      #crosshair.ads .ring { width: 12px; height: 12px; opacity: 0.9; }

      /* --- hitmarker --- */
      #hitmarker {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 900;
        color: #ffe680;
        text-shadow: 0 0 4px #000;
      }

      /* --- damage vignette --- */
      #vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, 0.85) 100%);
      }

      /* --- center message --- */
      #message {
        position: absolute;
        top: 26%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 4px;
        text-align: center;
        text-shadow: 0 3px 0 #000;
        white-space: nowrap;
      }

      /* --- toasts --- */
      #toasts {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .toast {
        background: rgba(0, 0, 0, 0.65);
        border: 2px solid #000;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        padding: 6px 14px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #ffe680;
        transition: opacity 0.7s;
      }
      .toast.fade { opacity: 0; }

      #lock-hint {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        opacity: 0.75;
        text-shadow: 0 1px 0 #000;
      }

      /* --- overlays (menu / death / victory) --- */
      #overlay {
        position: absolute;
        inset: 0;
        background: rgba(6, 8, 14, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }
      #overlay h1 {
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 10px;
        color: #ffe680;
        text-shadow: 4px 4px 0 #000, -2px -2px 0 #35f0ff;
      }
      #overlay h1.dead { color: #ff5a4f; text-shadow: 4px 4px 0 #000; }
      #overlay h1.win { color: #5aff7a; text-shadow: 4px 4px 0 #000; }
      #overlay .tagline { font-size: 16px; opacity: 0.85; letter-spacing: 1px; }
      #overlay .prompt {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #35f0ff;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #overlay table.controls {
        border-collapse: collapse;
        font-size: 14px;
        margin-top: 6px;
      }
      #overlay table.controls th,
      #overlay table.controls td {
        padding: 5px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      #overlay table.controls th { color: #ffe680; letter-spacing: 1px; }
      #overlay table.controls td:first-child { font-weight: 700; text-align: left; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
