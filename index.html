<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOLLOWMERE — Cel-Shaded Conquest</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        user-select: none;
      }

      /* --- minimap --- */
      /* Width/height are set from CONFIG.minimap.size in JS so the backing
         store and the CSS box can never drift apart and blur. */
      #minimap {
        position: absolute;
        top: 16px;
        left: 16px;
        border: 2px solid #000;
        border-radius: 4px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22);
        opacity: 0.92;
      }

      /* --- killfeed --- */
      #killfeed {
        position: absolute;
        top: 92px;
        right: 22px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .kill {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 3px 8px;
        display: flex;
        gap: 7px;
        align-items: center;
        text-shadow: 0 1px 0 #000;
        transition: opacity 0.6s ease-out;
      }
      .kill.fade { opacity: 0; }
      .kill .x { opacity: 0.55; }
      /* Anything the player did or had done to them reads brighter. */
      .kill.mine { border-color: #ffc46b; }
      .kill.mine .k { color: #ffc46b; }

      /* --- scoreboard (hold Tab) --- */
      #scoreboard {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(6, 8, 14, 0.92);
        border: 2px solid rgba(255, 255, 255, 0.18);
        padding: 22px 30px;
        text-align: center;
      }
      #scoreboard table { border-collapse: collapse; }
      #scoreboard th,
      #scoreboard td {
        padding: 7px 20px;
        font-size: 14px;
        letter-spacing: 2px;
        text-align: right;
      }
      #scoreboard th {
        font-size: 11px;
        opacity: 0.55;
        font-weight: 700;
      }
      #scoreboard td.name { text-align: left; font-weight: 800; }
      #scoreboard tr.mine td { color: #ffc46b; }
      #scoreboard tr.theirs td { color: #ff5a4f; }
      #scoreboard .you {
        margin-top: 14px;
        font-size: 12px;
        letter-spacing: 2px;
        opacity: 0.7;
      }

      /* --- deploy screen --- */
      /* #hud is pointer-events:none so the HUD never eats a game click; this
         overlay is the one thing that has to opt back in. */
      #deploy {
        position: absolute;
        inset: 0;
        background: rgba(6, 8, 14, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: auto;
      }
      #deploy h2 {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 6px;
        opacity: 0.75;
      }
      #deploy-map {
        width: min(62vh, 62vw);
        height: min(62vh, 62vw);
        border: 2px solid rgba(255, 255, 255, 0.22);
        cursor: crosshair;
        image-rendering: auto;
      }
      #deploy-status {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        opacity: 0.6;
      }
      #deploy-status.ready {
        opacity: 1;
        color: #ffc46b;
      }

      /* --- conquest: reinforcement counts --- */
      #ticket-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 0 #000;
      }
      #ticket-bar b {
        font-size: 21px;
        letter-spacing: 1px;
      }
      #ticket-bar .team.mine { color: #ffc46b; }
      #ticket-bar .team.theirs { color: #ff5a4f; }
      #ticket-bar .sep { opacity: 0.45; }

      /* --- conquest: the A..E flag strip --- */
      #flag-strip {
        position: absolute;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .flag {
        width: 46px;
        text-align: center;
        border: 2px solid #000;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
        padding: 2px 0 0;
      }
      .flag .id {
        display: block;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #8b8f96;
        text-shadow: 0 1px 0 #000;
      }
      .flag.mine .id { color: #ffc46b; }
      .flag.theirs .id { color: #ff5a4f; }
      /* A contested flag pulses so it reads from the corner of the eye. */
      .flag.contested { animation: flagPulse 0.7s ease-in-out infinite alternate; }
      @keyframes flagPulse {
        from { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18); }
        to { box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.55); }
      }
      .flag .cap {
        height: 4px;
        margin: 2px 3px 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .flag .cap-fill {
        height: 100%;
        width: 0;
        transition: width 0.15s linear;
      }
      .flag .cap-fill.mine { background: #ffc46b; }
      .flag .cap-fill.theirs { background: #ff5a4f; }

      /* --- bars --- */
      .bar {
        height: 14px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid #000;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
      .bar .fill {
        height: 100%;
        width: 100%;
        background: #5aff7a;
        transition: width 0.12s ease-out;
      }
      .bar .fill.low { background: #ff5a4f; }

      /* --- bottom panels --- */
      #hud-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 22px 28px;
      }
      .panel {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #000;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 10px 16px;
        min-width: 220px;
      }
      .panel.right {
        min-width: 130px;
        text-align: right;
      }
      .panel .label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 4px;
      }
      #health-text {
        font-size: 12px;
        margin-top: 4px;
        opacity: 0.85;
      }
      #ammo-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 0 #000;
      }
      #ammo-text.reloading { font-size: 16px; color: #ffb400; }

      /* --- crosshair --- */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: opacity 0.1s;
      }
      /* ADS never leaves third person, so the crosshair stays. The ring's
         size is set inline every frame from the live bullet spread. */
      #crosshair .dot {
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #000;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
      }
      #crosshair .ring {
        display: block;
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.6);
        border-radius: 50%;
        transition: width 0.12s, height 0.12s, opacity 0.12s;
      }

      /* --- hitmarker --- */
      #hitmarker {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 900;
        color: #ffe680;
        text-shadow: 0 0 4px #000;
      }

      /* --- damage vignette --- */
      #vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, 0.85) 100%);
      }

      /* --- center message --- */
      #message {
        position: absolute;
        top: 26%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 4px;
        text-align: center;
        text-shadow: 0 3px 0 #000;
        white-space: nowrap;
      }

      /* --- toasts --- */
      #toasts {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .toast {
        background: rgba(0, 0, 0, 0.65);
        border: 2px solid #000;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        padding: 6px 14px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #ffe680;
        transition: opacity 0.7s;
      }
      .toast.fade { opacity: 0; }

      #lock-hint {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        opacity: 0.75;
        text-shadow: 0 1px 0 #000;
      }

      /* --- overlays (menu / death / victory) --- */
      #overlay {
        position: absolute;
        inset: 0;
        background: rgba(6, 8, 14, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }
      #overlay h1 {
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 10px;
        color: #ffe680;
        text-shadow: 4px 4px 0 #000, -2px -2px 0 #35f0ff;
      }
      #overlay h1.dead { color: #ff5a4f; text-shadow: 4px 4px 0 #000; }
      #overlay h1.win { color: #5aff7a; text-shadow: 4px 4px 0 #000; }
      #overlay .tagline { font-size: 16px; opacity: 0.85; letter-spacing: 1px; }
      #overlay .prompt {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #35f0ff;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #overlay table.controls {
        border-collapse: collapse;
        font-size: 14px;
        margin-top: 6px;
      }
      #overlay table.controls th,
      #overlay table.controls td {
        padding: 5px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      #overlay table.controls th { color: #ffe680; letter-spacing: 1px; }
      #overlay table.controls td:first-child { font-weight: 700; text-align: left; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
