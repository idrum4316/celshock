# .github/workflows/docker.yml — build the image and push it to Docker Hub.
#
# main    -> idrum4316/hollowmere:main    + :latest
# develop -> idrum4316/hollowmere:develop
#
# Every push also gets an immutable :sha-<short> tag, which is what you roll
# back to; the branch tags move.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME — the Docker Hub account (idrum4316)
#   DOCKERHUB_TOKEN    — a Docker Hub access token with Read & Write scope,
#                        NOT the account password
name: Docker

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  IMAGE: idrum4316/hollowmere

# A second push to the same branch makes the in-flight build irrelevant — the
# tag it would move is about to be moved again.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `npm ci` is the slow layer and the lockfile rarely moves, so the
          # cache is worth more here than the ~1 min the build itself takes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
